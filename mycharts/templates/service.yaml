apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mavenwebapp-svc
  namespace: {{ .Values.namespace | default "ns1" }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Release.Name }}-mavenwebapp
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
