apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-mavenwebapp-ingress
  namespace: {{ .Values.namespace | default "ns1" }}
  annotations:
    {{- if .Values.ingress.annotations }}
    {{ toYaml .Values.ingress.annotations | nindent 4 }}
    {{- end }}
spec:
  rules:
  - host: {{ index .Values.ingress.hosts 0 "host" | default "chart-example.local" }}
    http:
      paths:
      - path: {{ .Values.ingress.path }}
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}-mavenwebapp-svc
            port:
              number: {{ .Values.service.port }}
  {{- if .Values.ingress.tls }}
  tls:
  - hosts:
    - {{ index .Values.ingress.hosts 0 "host" }}
    secretName: {{ .Values.ingress.tls.secretName | default "default-tls" }}
  {{- end }}
